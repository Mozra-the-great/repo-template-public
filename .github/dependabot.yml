version: 2

# Dependabot keeps the SHA-pinned actions in .github/workflows fresh (convention C5)
# and, once you uncomment a block below, the dependencies of your stack.
#
# cooldown (zizmor audit dependabot-cooldown): a new release is proposed only after
# 7 days. If a package is compromised that is usually noticed within that window;
# without the wait the bad version would sit in a PR immediately. Every ecosystem
# needs its own cooldown entry, so copy it into each block you enable.
#
# Cost: Dependabot runs as GitHub Actions jobs - free in a public repo, billed
# against the Actions minutes in a private one (see docs/TEMPLATE-SETUP.md, D1).
# Dependabot cannot read repository secrets, so Claude jobs skip its PRs
# (`github.actor != 'dependabot[bot]'`). Merge its PRs only after `build` ran on them.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(actions)"

  # ── Stack placeholders: uncomment what the repo actually uses ────────────────

  # Python (requirements*.txt, pyproject.toml, Pipfile)
  # - package-ecosystem: "pip"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   cooldown:
  #     default-days: 7
  #   commit-message:
  #     prefix: "chore(deps)"

  # Node (package.json + lockfile). Point `directory` at the folder that holds
  # the lockfile if it is not the repo root.
  # - package-ecosystem: "npm"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   cooldown:
  #     default-days: 7
  #   commit-message:
  #     prefix: "chore(deps)"

  # Dockerfile base images. No automatic major bumps for container images (C9):
  # a major jump (postgres 16 -> 17, redis 7 -> 8) usually needs a data or
  # config migration and belongs in a hand-prepared PR.
  # - package-ecosystem: "docker"
