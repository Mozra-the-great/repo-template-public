  #   schedule:
  #     interval: "weekly"
  #   cooldown:
  #     default-days: 7
  #   commit-message:
  #     prefix: "chore(docker)"
  #   ignore:
  #     - dependency-name: "*"
  #       update-types: ["version-update:semver-major"]

  # docker-compose.yml images (one PR per image, so a failure maps to one update)
  # - package-ecosystem: "docker-compose"
